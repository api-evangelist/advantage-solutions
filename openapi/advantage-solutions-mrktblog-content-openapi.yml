openapi: 3.1.0
info:
  title: MRKT Blog Content API (WordPress REST)
  version: wp/v2
  description: Publicly readable content API of MRKT (mrktblog.com), described by its own discovery document
    as 'MRKT | An Advantage Solutions Publication'. Derived from the WordPress REST route-discovery document
    the site serves at /wp-json/. Read operations on published posts, categories, tags and media are anonymous
    and were verified live; write operations require WordPress Application Passwords. This is the CMS
    API of a publication site, not a commercial product API.
  contact:
    name: Advantage Solutions
    url: https://mrktblog.com/contact/
  x-derived-from: https://mrktblog.com/wp-json/
  x-derivation: Mechanically converted from the WordPress REST route-discovery document served at the
    URL in x-derived-from. Paths, methods, parameter names, types, enums, defaults and descriptions are
    copied verbatim from that document. Editor/administration and host-plugin namespaces (wp-block-editor,
    wp-site-health, wp-abilities, wpe/cache-plugin, wpe_sign_on_plugin, yoast, templates, widgets, plugins,
    themes, fonts, blocks, navigation, global-styles) are omitted; the discovery document remains the
    complete list.
servers:
- url: https://mrktblog.com/wp-json
tags:
- name: categories
- name: comments
- name: media
- name: oembed
- name: pages
- name: posts
- name: search
- name: statuses
- name: tags
- name: taxonomies
- name: types
- name: users
