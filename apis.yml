apis:
  - aid: advantage-solutions:youradv-content
    name: Advantage Solutions Corporate Content API (WordPress REST)
    description: >-
      The publicly readable content API of the Advantage Solutions corporate site.
      youradv.com runs WordPress on WP Engine behind Cloudflare and serves the
      standard REST API at /wp-json/, advertising 219 routes across eight namespaces.
      Beyond WordPress core objects it exposes the company's own content types:
      Advantage360 research reports, MRKT blog posts, solutions, events, team
      members, board directors, reviews and blog authors. Read operations on
      published content need no credentials and were verified live; writes require
      a WordPress Application Password. This is a marketing-site CMS API, not a
      product API - Advantage Solutions publishes no developer program.
    humanURL: https://youradv.com/
    baseURL: https://youradv.com/wp-json
    tags:
      - Content
      - WordPress
      - REST
      - JSON
      - Research
    properties:
      - type: OpenAPI
        url: openapi/advantage-solutions-youradv-content-openapi.yml
      - type: Overlay
        url: overlays/advantage-solutions-youradv-overlay.yaml
      - type: Documentation
        url: https://developer.wordpress.org/rest-api/
      - type: DataModel
        url: data-model/advantage-solutions-data-model.yml
  - aid: advantage-solutions:mrktblog-content
    name: MRKT Blog Content API (WordPress REST)
    description: >-
      The publicly readable content API of MRKT, described by its own discovery
      document as "MRKT | An Advantage Solutions Publication". mrktblog.com runs
      WordPress on WP Engine behind Cloudflare and serves the standard REST API at
      /wp-json/ with 178 advertised routes, returning posts, categories, tags and
      media anonymously. It is the machine-readable counterpart to the RSS feed the
      company already publishes, and carries the retail and consumer-goods
      commentary Advantage Solutions produces for brands and retailers.
    humanURL: https://mrktblog.com/
    baseURL: https://mrktblog.com/wp-json
    tags:
      - Content
      - WordPress
      - REST
      - Blog
      - Retail
    properties:
      - type: OpenAPI
        url: openapi/advantage-solutions-mrktblog-content-openapi.yml
      - type: Overlay
        url: overlays/advantage-solutions-mrktblog-overlay.yaml
      - type: Documentation
        url: https://developer.wordpress.org/rest-api/
      - type: RSSFeed
        url: https://mrktblog.com/feed/
